<!doctype html><html><head><meta charset="utf-8"><style>body{font:12px Inter,Arial;padding:14px;color:#222}textarea{width:100%;height:230px;box-sizing:border-box;border:1px solid #ddd;border-radius:6px;padding:8px;font:10px monospace}button{margin-top:10px;background:#20251b;color:white;border:0;border-radius:6px;padding:10px;width:100%;cursor:pointer}p{color:#777;line-height:1.4}</style></head><body><b>WebExtract → Figma</b><p>Paste a WebExtract design.json file's contents. The plugin creates editable text and layout layers.</p><textarea id="json" placeholder="Paste design JSON here…"></textarea><button id="create">Create editable layers</button><p id="status"></p><script>document.getElementById("create").onclick=()=>{try{parent.postMessage({pluginMessage:{type:"IMPORT",data:JSON.parse(document.getElementById("json").value)}}, "*");document.getElementById("status").textContent="Import sent to Figma…"}catch(e){document.getElementById("status").textContent="Invalid JSON: "+e.message}};onmessage=e=>{if(e.data.pluginMessage?.type==="DONE")document.getElementById("status").textContent="Created "+e.data.pluginMessage.count+" layers."}</script></body></html>
